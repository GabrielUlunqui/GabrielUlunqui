<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Hola, soy Gabriel Ulunqui. Desarrollador Full-Stack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0a26"/>
      <stop offset="0.55" stop-color="#15113a"/>
      <stop offset="1" stop-color="#2a2268"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="r"><rect width="1280" height="320" rx="24"/></clipPath>
    <style>
      .t { font-family: 'Segoe UI', Poppins, 'Helvetica Neue', Arial, sans-serif; }
      .m { font-family: Consolas, 'Cascadia Code', 'Fira Code', Menlo, monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .float { animation: float 6s ease-in-out infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes float { 50% { transform: translateY(-8px); } }
    </style>
  </defs>

  <g clip-path="url(#r)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#grid)"/>
    <circle cx="1080" cy="40" r="260" fill="url(#glowV)"/>
    <circle cx="140" cy="300" r="220" fill="url(#glowC)"/>

    <g class="t">
      <text x="72" y="108" fill="#a5a1cf" font-size="26" font-weight="500">Hola, soy</text>
      <text x="72" y="170" fill="#ffffff" font-size="60" font-weight="800">Gabriel <tspan fill="url(#acc)">Ulunqui</tspan></text>
      <text x="72" y="216" fill="#ffffff" font-size="28" font-weight="600">Desarrollador Full-Stack</text>
    </g>
    <text class="m" x="72" y="258" fill="#22d3ee" font-size="19">Python · FastAPI · PostgreSQL · React</text>
    <rect x="72" y="278" width="72" height="5" rx="2.5" fill="url(#acc)"/>

    <g class="float">
      <rect x="760" y="62" width="452" height="196" rx="16" fill="#1e1850" fill-opacity="0.85" stroke="#352c7a"/>
      <circle cx="788" cy="88" r="6" fill="#f87171"/>
      <circle cx="808" cy="88" r="6" fill="#fbbf24"/>
      <circle cx="828" cy="88" r="6" fill="#34d399"/>
      <text class="m" x="1188" y="93" fill="#a5a1cf" font-size="14" text-anchor="end">ordenes.py</text>
      <line x1="760" y1="108" x2="1212" y2="108" stroke="#352c7a"/>
      <g class="m" font-size="17">
        <text x="788" y="142"><tspan fill="#c084fc">@router</tspan><tspan fill="#e2e8f0">.post(</tspan><tspan fill="#34d399">"/ordenes"</tspan><tspan fill="#e2e8f0">)</tspan></text>
        <text x="788" y="172"><tspan fill="#c084fc">def </tspan><tspan fill="#22d3ee">crear_orden</tspan><tspan fill="#e2e8f0">(orden: </tspan><tspan fill="#fbbf24">OrdenIn</tspan><tspan fill="#e2e8f0">):</tspan></text>
        <text x="820" y="202"><tspan fill="#e2e8f0">validar_estado(orden)</tspan></text>
        <text x="820" y="232"><tspan fill="#c084fc">return </tspan><tspan fill="#e2e8f0">servicio.crear(orden)</tspan></text>
        <rect class="cursor" x="1090" y="216" width="10" height="20" fill="#22d3ee"/>
      </g>
    </g>
  </g>
</svg>
